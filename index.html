<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ขอซื้อสาขา</title>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<!--
  Davis ขอซื้อสาขา — the purchase board (work order #9, 2026-10-18).
  One file, no build, no framework. Talks only to the Davis Maintain web app
  (purchase-liff-api.js there). Colours are the Order board's, every value.
  ?demo=1 runs the whole board on sample data in this page, no backend.
-->
<style>
:root{
  --bg:#23272E; --panel:#262B33; --sink:#1E2228; --line:#2F353E; --edge:#3B4350;
  --ink:#E8EBF0; --muted:#9AA3B2; --faint:#6B7382;
  --accent:#2FA39A; --accent-ink:#08201E;
  --ok:#6FD39A; --ok-bg:#1E3A2C;
  --warn-bg:#3A3116; --warn-ink:#E3B341;
  --hot-bg:#3D2A1C; --hot-ink:#F0B48C;
  --free-bg:#1F2A3F; --free-ink:#93C5FD;
  --danger:#F08C8C; --no-bg:#3D2222; --danger-ink:#3D1414;
  --part-bg:#2B2440; --part-ink:#B7A3F5;
  --raise:6px 6px 14px rgba(0,0,0,.55),-4px -4px 12px rgba(255,255,255,.055);
  --sink-sh:inset 4px 4px 10px rgba(0,0,0,.55),inset -3px -3px 8px rgba(255,255,255,.055);
  --r-sm:12px; --r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--free-ink);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.demo{background:var(--part-bg);color:var(--part-ink);font-size:12px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.demo b{margin-right:4px}
.demo button{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--part-ink);background:none;color:var(--part-ink);font-size:12px;font-weight:700;cursor:pointer}
.demo button.on{background:var(--part-ink);color:var(--part-bg)}
.head{min-height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:18px;font-weight:700}
.who{font-size:12px;color:var(--muted);margin-top:2px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.iconbtn{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--panel);border:0;cursor:pointer;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1;min-height:48px;background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;padding:0 6px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;font-size:12px;color:var(--muted);font-weight:600}
.fhead button{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;min-height:44px;padding:0}
.filters{display:flex;gap:8px;padding:4px 16px 0;overflow-x:auto;scrollbar-width:none}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill b{color:var(--ink)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.on b{color:var(--accent-ink)}
.fsum{margin:10px 16px 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--sink);display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.fsum b{color:var(--ink)}
.body{flex:1;padding:16px 16px 32px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px;color:var(--ink);text-align:left;border:0;width:100%}
button.card{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.id{font-size:12px;color:var(--muted);font-weight:600}
.ttl{font-size:16px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.wait{background:var(--warn-bg);color:var(--warn-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--no-bg);color:var(--danger)}
.chip.info{background:var(--free-bg);color:var(--free-ink)}
.chip.part{background:var(--part-bg);color:var(--part-ink)}
.chip.off{background:var(--sink);color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--edge);color:var(--muted)}
.tag.path{border-color:var(--accent);color:var(--ok)}
.tag.cat{background:var(--free-bg);color:var(--free-ink);border-color:var(--free-bg)}
.tag.hi{background:var(--hot-bg);color:var(--hot-ink);border-color:var(--hot-bg)}
.venue{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--free-bg);color:var(--free-ink);white-space:nowrap}
.age{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
.age.hot{background:var(--hot-bg);color:var(--hot-ink)}
.sec{font-size:12px;color:var(--muted);font-weight:700;margin:6px 0 -4px}
.baht{font-weight:700;color:var(--ink)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:32px 8px;line-height:1.6}
.btn{min-height:56px;border-radius:var(--r-sm);border:0;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 16px;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--edge)}
.btn.no{background:var(--panel);color:var(--danger);border:1px solid #5A2A2A}
.btn.danger{background:var(--danger);color:var(--danger-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.sm{min-height:48px;font-size:15px}
.acts{display:flex;gap:10px}
.acts>.btn{flex:1}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln.ro{grid-template-columns:minmax(0,1fr) auto}
.ln input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--accent)}
.ln label,.ln .n{display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.ln label{cursor:pointer;min-height:44px;justify-content:center}
.ln small{font-size:12px;color:var(--muted)}
.ln .amt{font-size:15px;font-weight:700;white-space:nowrap;text-align:right}
.ln .amt.big{font-size:17px}
.ln .amt.unknown{color:var(--warn-ink);font-weight:600;font-size:13px}
.ln.off label,.ln.off .n>span:first-child{color:var(--muted);text-decoration:line-through}
.ln .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;justify-self:end;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.no{background:var(--no-bg);color:var(--danger)}
.st.wait{background:var(--warn-bg);color:var(--warn-ink)}
.why{font-size:12px;color:var(--hot-ink)}
.hintno{font-size:12px;color:var(--hot-ink)}
.total{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.total b{color:var(--ink);font-size:16px}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-weight:600;min-height:28px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.in{min-height:48px;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--sink);color:var(--ink);padding:10px 12px;font-size:16px;width:100%;box-shadow:var(--sink-sh)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.err{font-size:13px;color:var(--danger);font-weight:600}
.in.bad,.item.bad{border-color:var(--danger)}
/* form */
.fsec{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:center;gap:10px}
.sh .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sh h2{margin:0;font-size:16px;font-weight:700}
.sh .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:14px;border:2px solid var(--edge);background:var(--panel);padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px;position:relative}
.tile.on{border-color:var(--accent);background:#1E3A37}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted);line-height:1.35}
.tile .ck{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.choice{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);font-size:13px;font-weight:600;cursor:pointer}
.choice.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.item{background:var(--panel);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--raise);border:1px solid transparent}
.item .top{display:flex;align-items:center;gap:10px}
.idx{width:24px;height:24px;border-radius:50%;background:var(--sink);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.name{flex:1;min-height:48px;border:0;border-bottom:1px solid var(--edge);background:none;font-size:17px;font-weight:700;padding:0 2px;min-width:0}
.qtyrow,.pricerow{display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;border:1px solid var(--edge);border-radius:var(--r-sm);overflow:hidden;background:var(--sink)}
.step button{width:44px;height:44px;border:0;background:none;color:var(--accent);font-size:22px;font-weight:700;cursor:pointer}
.step input{width:52px;height:44px;border:0;background:none;text-align:center;font-size:17px;font-weight:700;padding:0}
.unit{min-height:44px;border:1px solid var(--edge);border-radius:var(--r-sm);background:var(--sink);font-size:15px;padding:0 12px;min-width:0;flex:1}
.pricerow .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
.price{min-height:44px;border:1px solid var(--edge);border-radius:var(--r-sm);background:var(--sink);display:flex;align-items:center;padding:0 12px;gap:6px;flex:1;min-width:0}
.price span{color:var(--muted)}
.price input{border:0;background:none;font-size:17px;font-weight:700;width:100%;min-width:0;padding:0;min-height:42px}
.eq{font-size:17px;font-weight:700;color:var(--ok);white-space:nowrap;margin-left:auto}
.eq.unknown{color:var(--warn-ink);font-size:13px;font-weight:600}
.from{display:flex;align-items:center;gap:8px;min-height:44px;border-radius:var(--r-sm);background:var(--sink);border:1px dashed var(--edge);padding:0 12px}
.from input{border:0;background:none;font-size:14px;flex:1;min-width:0;padding:0;min-height:42px}
.from button{border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px;padding:0}
.add{min-height:52px;border-radius:14px;border:2px dashed var(--edge);background:none;color:var(--accent);font-size:15px;font-weight:700;cursor:pointer}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:var(--r-sm);overflow:hidden;background:var(--sink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.photo{min-height:56px;border-radius:var(--r-sm);border:1px dashed var(--edge);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;background:none;cursor:pointer;width:100%}
.bar{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--bg);z-index:6}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum .l{font-size:13px;color:var(--muted)}
.sum .big{font-size:24px;font-weight:700;color:var(--ok);line-height:1}
.sum .note{font-size:12px;color:var(--warn-ink);margin-top:4px}
/* detail */
.panel{background:var(--panel);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;color:var(--muted);font-weight:700}
.dttl{font-size:20px;font-weight:700;line-height:1.3;margin:0;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.stp .d{width:100%;height:6px;border-radius:3px;background:var(--line)}
.stp.done .d{background:var(--accent)}
.stp.done{color:var(--ink);font-weight:700}
.stp.now .d{background:var(--warn-ink)}
.stp.now{color:var(--warn-ink);font-weight:700}
.tls{display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin:5px auto 0;box-shadow:0 0 0 3px var(--ok-bg)}
.rail{width:2px;background:var(--line);margin:4px auto 0;min-height:24px}
.tt{font-size:15px;font-weight:700}
.sm{font-size:13px;color:var(--muted);line-height:1.45;padding-bottom:12px;overflow-wrap:anywhere}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pics a{display:block;width:96px;height:96px;border-radius:var(--r-sm);overflow:hidden;background:var(--sink)}
.pics img{width:100%;height:100%;object-fit:cover}
/* by shop */
.month{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.month b{font-size:15px}
.month button{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--edge);background:var(--panel);cursor:pointer;font-size:18px}
.shop{font-size:18px;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{background:var(--sink);border-radius:var(--r-sm);padding:10px 10px 8px;display:flex;flex-direction:column;gap:2px}
.num .v{font-size:20px;font-weight:700;line-height:1}
.num .k{font-size:11px;color:var(--muted)}
.num.wait .v{color:var(--warn-ink)} .num.buy .v{color:var(--free-ink)} .num.money .v{color:var(--ok);font-size:17px}
.sbar{height:8px;border-radius:4px;background:var(--sink);display:flex;overflow:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.go{font-size:13px;color:var(--accent);font-weight:700}
/* sheets and toast */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--panel);border-radius:20px 20px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 24px rgba(0,0,0,.6);z-index:21;max-height:90vh;overflow:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--edge);margin:0 auto}
.sheet h2{margin:0;font-size:18px;font-weight:700}
.sub{font-size:14px;color:var(--muted);line-height:1.5}
.q{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#11151B;color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:var(--raise)}
.toast.bad{border-color:var(--danger);color:var(--danger)}
.notice{padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.notice h2{margin:0;font-size:18px}
.notice p{margin:0;color:var(--muted);line-height:1.6}
.build{font-size:11px;color:var(--faint);text-align:center;padding:8px 0 16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var BUILD = 'pr-board v1 · 2026-10-18';
  // The Davis Maintain web app (prod deployment that LINE uses). One line.
  var API_URL = 'https://script.google.com/macros/s/AKfycbwW4Cx0k-hmBcRxcaFy_2RPJO8jwfr9T7vfOnCp4u4aUZNn2A6mFgTkVWk8u_TGkdO0UA/exec';
  // The LIFF app "Davis ขอซื้อ". Empty until the owner creates it and sends the id.
  var LIFF_ID = '';
  var STORE_KEY = 'davisPurchase.v1';
  var POLL_MS = 10000;
  var QS = (function () {
    var q = location.search || '';
    // LIFF may redirect and hand the original query over inside liff.state.
    var m = /[?&]liff\.state=([^&]*)/.exec(q);
    if (m) { try { q = decodeURIComponent(m[1]); } catch (e) { /* keep q */ } }
    return q;
  })();
  var DEMO_MODE = /[?&]demo=1\b/.test(QS);

/* LOGIC START */
  var L = {
    noLine: 'ยังไม่ได้เชื่อมกับไลน์ ปิดหน้านี้แล้วเปิดจากลิงก์ในไลน์อีกครั้ง',
    unknownPerson: 'ระบบยังไม่รู้จักคุณ พิมพ์ ลงทะเบียน ในกลุ่มไลน์ก่อน',
    notForYou: 'บอร์ดนี้สำหรับผู้จัดการสาขา จัดซื้อ ผู้บริหาร และบัญชี',
    boardOff: 'บอร์ดขอซื้อยังไม่เปิดใช้',
    unknownPrice: 'ยังไม่ทราบ', noCategory: 'ไม่ระบุประเภท', defaultUnit: 'ชิ้น',
    buyer: { self: 'ฉันซื้อเอง', purchasing: 'ให้จัดซื้อซื้อให้' },

    }
    h += '<section class="fsec" id="sec-buyer"><div class="sh"><span class="n">1</span><h2>ใครเป็นคนซื้อ</h2></div><div class="tiles" role="group" aria-label="ใครเป็นคนซื้อ">' +
      [['self', 'ฉันซื้อเอง', 'แล้วเบิกคืนตามระบบบริษัท'], ['purchasing', 'ให้จัดซื้อซื้อให้', 'ระบุประเภทและร้านที่จะซื้อ']].map(function (b) {
        return '<button type="button" class="tile' + (f.buyer === b[0] ? ' on' : '') + '" data-act="buyer" data-k="' + b[0] + '" aria-pressed="' + (f.buyer === b[0]) + '">' +
          (f.buyer === b[0] ? '<span class="ck" aria-hidden="true">✓</span>' : '') + '<b>' + b[1] + '</b><span>' + b[2] + '</span></button>';
      }).join('') + '</div>' + (e.buyer ? '<div class="err" id="err-buyer">' + esc(e.buyer) + '</div>' : '') + '</section>';
    var step = 2;
    if (f.buyer === 'purchasing') {
      h += '<section class="fsec" id="sec-category"><div class="sh"><span class="n">' + (step++) + '</span><h2>ประเภท</h2></div><div class="chips" role="group" aria-label="ประเภท">' +
        (S.me.categories || []).map(function (c) {
          return '<button type="button" class="choice' + (f.category === c ? ' on' : '') + '" data-act="cat" data-k="' + esc(c) + '" aria-pressed="' + (f.category === c) + '">' + esc(c) + '</button>';
        }).join('') + '</div>' + (e.category ? '<div class="err" id="err-category">' + esc(e.category) + '</div>' : '') + '</section>';
    }
    h += '<section class="fsec" id="sec-items"><div class="sh"><span class="n">' + (step++) + '</span><h2>รายการ</h2><span class="cnt">' + f.items.length + ' ชิ้น · ราคาไม่รู้เว้นได้</span></div>';
    f.items.forEach(function (it, i) {
      var k = 'item' + i;
      var lt = lineTotal(it);
      var bad = e[k + '.name'] || e[k + '.qty'] || e[k + '.price'] || e[k + '.from'];
      h += '<div class="item' + (bad ? ' bad' : '') + '" id="sec-' + k + '"><div class="top"><span class="idx">' + (i + 1) + '</span>' +
        '<input class="name" type="text" data-item="' + i + '" data-f="name" value="' + esc(it.name) + '" placeholder="ชื่อของ เช่น สบู่ล้างมือ" aria-label="ชื่อของ ชิ้นที่ ' + (i + 1) + '">' +
        (f.items.length > 1 ? '<button type="button" class="iconbtn" style="background:none" data-act="delItem" data-k="' + i + '" aria-label="ลบชิ้นที่ ' + (i + 1) + '">' + icon('trash') + '</button>' : '') + '</div>' +
        '<div class="qtyrow"><div class="step"><button type="button" data-act="qty" data-k="' + i + '" data-d="-1" aria-label="ลดจำนวน ชิ้นที่ ' + (i + 1) + '">−</button>' +
        '<input type="text" inputmode="numeric" data-item="' + i + '" data-f="qty" value="' + esc(it.qty) + '" aria-label="จำนวน ชิ้นที่ ' + (i + 1) + '">' +
        '<button type="button" data-act="qty" data-k="' + i + '" data-d="1" aria-label="เพิ่มจำนวน ชิ้นที่ ' + (i + 1) + '">+</button></div>' +
        '<input class="unit" type="text" data-item="' + i + '" data-f="unit" value="' + esc(it.unit) + '" aria-label="หน่วย ชิ้นที่ ' + (i + 1) + '"></div>' +
        '<div class="pricerow"><span class="lbl">× ราคา/หน่วย</span><div class="price"><span>฿</span><input type="text" inputmode="decimal" data-item="' + i + '" data-f="price" value="' + esc(it.price) + '" placeholder="ไม่รู้ เว้นได้" aria-label="ราคาต่อหน่วย ชิ้นที่ ' + (i + 1) + '"></div>' +
        '<span class="eq' + (lt === null ? ' unknown' : '') + '" id="eq-' + i + '">' + (lt === null ? L.unknownPrice : '= ' + fmtBaht(lt)) + '</span></div>';
      if (f.buyer === 'purchasing') {
        h += '<div class="from">' + icon('shop') + '<input type="text" data-item="' + i + '" data-f="from" value="' + esc(it.from) + '" placeholder="ซื้อจาก: ลิงก์ หรือชื่อร้าน" aria-label="ซื้อจาก ชิ้นที่ ' + (i + 1) + '">' +
          (i > 0 ? '<button type="button" data-act="sameFrom" data-k="' + i + '">เหมือนชิ้นบน</button>' : '') + '</div>';
      }
      ['name', 'qty', 'price', 'from'].forEach(function (fld) { if (e[k + '.' + fld]) h += '<div class="err">' + esc(e[k + '.' + fld]) + '</div>'; });
      h += '</div>';
    });
    h += '<button type="button" class="add" data-act="addItem">+ เพิ่มชิ้นที่ ' + (f.items.length + 1) + '</button>' + (e.items ? '<div class="err">' + esc(e.items) + '</div>' : '') + '</section>';
    h += '<section class="fsec" id="sec-reason"><div class="sh"><span class="n">' + (step++) + '</span><h2>เหตุผลและรูป</h2></div>' +
      '<div class="field"><label for="why">ทำไมต้องซื้อ</label><textarea class="in' + (e.reason ? ' bad' : '') + '" id="why" data-f="reason" placeholder="เช่น ของเดิมจะหมดภายในสัปดาห์นี้">' + esc(f.reason) + '</textarea>' +
      (e.reason ? '<div class="err" id="err-reason">' + esc(e.reason) + '</div>' : '') + '</div>';
    if (f.photos.length) h += '<div class="photos">' + f.photos.map(function (p, i) {
      return '<div class="thumb"><img src="' + p + '" alt="รูปที่ ' + (i + 1) + '"><button type="button" data-act="delPhoto" data-k="' + i + '" aria-label="ลบรูปที่ ' + (i + 1) + '">×</button></div>';
    }).join('') + '</div>';
    if (f.photos.length < MAX_PHOTOS) h += '<label class="photo">' + icon('cam') + 'แนบรูป (ไม่บังคับ · ' + f.photos.length + '/' + MAX_PHOTOS + ')<input type="file" accept="image/*" multiple data-act="photo" class="vh"></label>';
    if (e.photos) h += '<div class="err">' + esc(e.photos) + '</div>';
    h += '</section></div>';
    h += '<div class="bar"><div class="sum"><div><div class="l" id="sumL">รวมประมาณ ' + t.count + ' ชิ้น</div><div class="note" id="sumN">' + (t.unpriced ? 'อีก ' + t.unpriced + ' ชิ้นยังไม่ใส่ราคา' : '') + '</div></div>' +
      '<div class="big" id="sumB">฿' + fmtBaht(t.total) + '</div></div><button type="button" class="btn pri" data-act="submit"' + (f.sending ? ' disabled' : '') + '>' + (f.sending ? 'กำลังส่ง…' : 'ส่งคำขอ') + '</button></div>';
    return h;
  }
  function afterForm() {
    if (S.form && S.form.scrollTo) {
      var el = document.getElementById(S.form.scrollTo);
      if (el) el.scrollIntoView({ block: 'center' });
      S.form.scrollTo = '';
    }
  }
  function refreshFormSums() {
    var t = formTotals(S.form.items);
    var setT = function (id, s) { var el = document.getElementById(id); if (el) el.textContent = s; };
    setT('sumL', 'รวมประมาณ ' + t.count + ' ชิ้น');
    setT('sumN', t.unpriced ? 'อีก ' + t.unpriced + ' ชิ้นยังไม่ใส่ราคา' : '');
    setT('sumB', '฿' + fmtBaht(t.total));
    S.form.items.forEach(function (it, i) {
      var el = document.getElementById('eq-' + i);
      if (!el) return;
      var lt = lineTotal(it);
      el.textContent = lt === null ? L.unknownPrice : '= ' + fmtBaht(lt);
      el.className = 'eq' + (lt === null ? ' unknown' : '');
    });
  }
  function submitForm() {
    var f = S.form;
    var v = validateForm(f, { categories: S.me.categories, needVenue: true });
    f.errors = v.errors;
    if (!v.ok) {
      var key = v.first;
      f.scrollTo = key.indexOf('item') === 0 ? 'sec-' + key.split('.')[0] : 'sec-' + key;
      render();
      return;
    }
    f.sending = true; render();
    var payload = {
      venue: f.venue, buyer: f.buyer, category: f.buyer === 'purchasing' ? f.category : '',
      items: f.items.map(function (it) { return { name: it.name, qty: Number(it.qty), unit: it.unit, unitPrice: priceOf(it.price), from: f.buyer === 'purchasing' ? it.from : '' }; }),
      reason: f.reason, photoDataUrls: f.photos,
    };
    api('prCreate', payload).then(function (res) {
      S.form = null; S.view = 'list';
      S.tab = S.me.role === 'venue_manager' ? 'active' : 'pending'; S.venue = '';
      toast('ส่งคำขอแล้ว · ' + res.id + (res.photosAsked && res.photosSaved < res.photosAsked ? ' (รูปขึ้นได้ ' + res.photosSaved + ' จาก ' + res.photosAsked + ')' : ''));
      // Seen at once: the new request is drawn before the server answers the next read.
      if (S.board && S.board.rows) {
        var t = formTotals(f.items);
        S.board.rows.unshift({ id: res.id, createdAt: '', venue: f.venue, requester: S.me.actorName, mine: true, buyer: f.buyer, buyerLabel: L.buyer[f.buyer],
          category: payload.category, items: payload.items.map(function (i, k) { return { n: k + 1, name: i.name, qty: i.qty, unit: i.unit, unitPrice: i.unitPrice, lineTotal: lineTotal(i), status: 'pending' }; }),
          estTotal: t.total, pricedLines: t.priced, lineCount: t.count, status: 'pending', fulfilment: '', ageMinutes: 0 });
        if (S.board.mineRows) S.board.mineRows = S.board.rows;
      }
      render(); window.scrollTo(0, 0); load(true);
    }, function (e) { f.sending = false; render(); toast(e.message, true); });
  }
  /** Phone photos are big: scaled to 1280 px on the long side, JPEG, before they are sent. */
  function readPhoto(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var s = Math.min(1, 1280 / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = fr.result;
      };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }

  // ---- events -----------------------------------------------------------------
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT') return;
    var act = el.getAttribute('data-act'), k = el.getAttribute('data-k');
    var f = S.form;
    switch (act) {
      case 'as': DEMO.as(k); S.me = null; S.board = null; S.shops = null; S.checks = {}; S.fields = {}; S.view = 'list'; S.sheet = null; boot(); return;
      case 'tab':
        S.tab = k; S.venue = ''; S.board = null; S.shops = null;
        if (k === 'byshop' && !S.month) S.month = (S.me.serverNow || '').slice(0, 7);
        render(); load(); return;
      case 'venue': S.venue = k; S.board = Object.assign({}, S.board, { rows: null }); load(); render(); return;
      case 'shop': S.tab = 'pending'; S.venue = k; S.board = null; render(); load(); return;
      case 'month': S.month = shiftMonth(S.month, Number(k)); S.shops = null; render(); load(); return;
      case 'open': openDetail(k); return;
      case 'back': S.view = 'list'; S.detail = null; render(); load(true); return;
      case 'new': S.form = newForm(); S.view = 'form'; render(); window.scrollTo(0, 0); return;
      case 'closeForm': S.form = null; S.view = 'list'; render(); return;
      case 'buyer': f.buyer = k; delete f.errors.buyer; render(); return;
      case 'cat': f.category = k; delete f.errors.category; render(); return;
      case 'fvenue': f.venue = k; delete f.errors.venue; render(); return;
      case 'qty': f.items[k].qty = Math.max(1, (Number(f.items[k].qty) || 0) + Number(el.getAttribute('data-d'))); render(); return;
      case 'addItem': f.items.push({ name: '', qty: 1, unit: L.defaultUnit, price: '', from: '' }); f.scrollTo = 'sec-item' + (f.items.length - 1); render(); return;
      case 'delItem': f.items.splice(Number(k), 1); f.errors = {}; render(); return;
      case 'sameFrom': f.items[k].from = f.items[k - 1].from; render(); return;
      case 'delPhoto': f.photos.splice(Number(k), 1); render(); return;
      case 'submit': if (!f.sending) submitForm(); return;
      case 'approve': {
        var r = findRow(k), plan = decisionPlan(r, checksOf(r), S.me.highAmount);
        if (plan.needsReason) S.sheet = { kind: 'reject', id: k, whole: false };
        else if (plan.high) S.sheet = { kind: 'high', id: k };
        else { sendDecision(r, false, ''); return; }
        render(); return;
      }
      case 'rejectAll': S.sheet = { kind: 'reject', id: k, whole: true }; render(); return;
      case 'quick': S.sheet.reason = k; S.sheet.err = ''; render(); return;
      case 'closeSheet': S.sheet = null; render(); return;
      case 'confirmReject': {
        var why = String(S.sheet.reason || '').trim();
        if (!why) { S.sheet.err = 'ใส่เหตุผลก่อนยืนยัน'; render(); return; }
        el.disabled = true;
        sendDecision(findRow(S.sheet.id), S.sheet.whole, why); return;
      }
      case 'confirmApprove': el.disabled = true; sendDecision(findRow(S.sheet.id), false, ''); return;
      case 'cancel': S.sheet = { kind: 'cancel', id: k }; render(); return;
      case 'confirmCancel': el.disabled = true; after(api('prCancel', { id: S.sheet.id }), 'ยกเลิก ' + S.sheet.id + ' แล้ว'); return;
      case 'ordered': {
        var fl = S.fields[k] || {};
        var a = priceOf(fl.actual);
        if (a === null || isNaN(a) || a <= 0) { fl.err = L.err.actualTotal; render(); return; }
        if (!String(fl.eta || '').trim()) { fl.err = L.err.eta; render(); return; }
        fl.err = ''; el.disabled = true; el.textContent = 'กำลังบันทึก…';
        after(api('prOrdered', { id: k, actualTotal: a, eta: fl.eta }), 'บันทึกสั่งซื้อแล้ว · ' + k).then(function () { delete S.fields[k]; });
        return;
      }
      case 'delivered': el.disabled = true; el.textContent = 'กำลังบันทึก…'; after(api('prDelivered', { id: k }), 'ส่งถึงสาขาแล้ว · ' + k); return;
      case 'received': el.disabled = true; el.textContent = 'กำลังบันทึก…'; after(api('prReceived', { id: k }), 'รับของแล้ว · ' + k); return;
    }
  });
  app.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.getAttribute('data-act') === 'tick') {
      var ck = S.checks[el.getAttribute('data-k')] || {};
      ck[el.getAttribute('data-n')] = el.checked;
      render();
    } else if (el.getAttribute('data-act') === 'photo') {
      var files = Array.prototype.slice.call(el.files || []).slice(0, MAX_PHOTOS - S.form.photos.length);
      Promise.all(files.map(readPhoto)).then(function (urls) { S.form.photos = S.form.photos.concat(urls).slice(0, MAX_PHOTOS); render(); },
        function () { toast('อ่านรูปไม่ได้ ลองเลือกรูปอื่น', true); });
    }
  });
  app.addEventListener('input', function (ev) {
    var el = ev.target;
    if (S.form && el.hasAttribute('data-item')) {
      S.form.items[Number(el.getAttribute('data-item'))][el.getAttribute('data-f')] = el.value;
      refreshFormSums();
    } else if (S.form && el.getAttribute('data-f') === 'reason') {
      S.form.reason = el.value;
    } else if (el.getAttribute('data-field')) {
      var fl = S.fields[el.getAttribute('data-k')] || (S.fields[el.getAttribute('data-k')] = {});
      fl[el.getAttribute('data-field')] = el.value;
    } else if (el.getAttribute('data-sheet') === 'reason' && S.sheet) {
      S.sheet.reason = el.value;
    }
  });

  // ---- start --------------------------------------------------------------------
  function startWith(me) {
    if (!me.known) { S.notice = { title: 'ระบบยังไม่รู้จักคุณ', text: me.message || L.unknownPerson }; render(); return; }
    if (me.allowed === false) { S.notice = { title: 'บอร์ดนี้ยังไม่ได้เปิดให้คุณ', text: L.notForYou }; render(); return; }
    S.notice = null;
    S.me = me;
    if (!S.tab || !tabsFor(me).some(function (t) { return t.key === S.tab; })) S.tab = tabsFor(me)[0].key;
    S.month = (me.serverNow || '').slice(0, 7);
    render();
    load();
  }
  function boot() {
    render();
    api('prWhoAmI', {}).then(startWith, function (e) {
      if (S.me) { toast(e.message, true); return; }
      S.notice = { title: e.message === L.boardOff ? L.boardOff : 'เปิดบอร์ดไม่สำเร็จ', text: e.message === L.boardOff ? 'รอผู้ดูแลระบบเปิดใช้' : e.message };
      render();
    });
  }
  if (DEMO_MODE) {
    var as = (/[?&]as=(\w+)/.exec(QS) || [])[1];
    DEMO = makeDemo(as || 'venue_manager');
    boot();
    return;
  }
  // The last board, painted before LINE answers.
  var cached = store(true);
  if (cached && cached.me) {
    S.me = cached.me;
    S.tab = tabsFor(cached.me)[0].key;
    S.board = (cached.boards || {})[S.tab + '|'] || null;
    render();
  }
  if (!LIFF_ID) {
    S.me = null;
    S.notice = { title: L.boardOff, text: 'ยังไม่ได้ตั้งค่า LIFF ของบอร์ด รอผู้ดูแลระบบเปิดใช้' };
    render();
    return;
  }
  var sdk = document.createElement('script');
  sdk.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  sdk.onload = function () {
    liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      try { idToken = liff.getIDToken() || ''; accessToken = liff.getAccessToken() || ''; } catch (e) { /* freshCreds tries again */ }
      authReadyResolve();
      boot();
    }, function () { authReadyResolve(); boot(); });
  };
  sdk.onerror = function () { S.notice = { title: 'เปิดบอร์ดไม่สำเร็จ', text: 'โหลดไลน์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่' }; render(); };
  document.head.appendChild(sdk);
})();
</script>
