<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Davis Care</title>
<!-- Work order #18: an installable app (manifest, icons, sw.js). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E2228">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Davis Care">
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<!--
  Davis ขอซื้อสาขา — the purchase board (work order #9, 2026-10-18; Order shape since #12, 2026-10-19).
  One file, no build, no framework. Talks only to the Davis Maintain web app
  (purchase-liff-api.js there). Colours are the Order board's, every value.
  ?demo=1 runs the whole board on sample data in this page, no backend.
-->
<style>
/* Work order #12: the Order board's anatomy, value for value
   (davis-order-liff/index.html, v45, read-only). Dark always, like Order. */
:root{
  color-scheme:dark;
  --bg:#23272E; --card:#23272E; --panel:#262B33; --line:#2F353E;
  --ink:#E8EBF0; --ink-2:#9AA3B2; --ink-3:#E8EBF0; --muted:#9AA3B2; --faint:#6B7382;
  /* A1.4 (work order #16 §1.4, owner 20 Oct 2026: too many colours): three
     colours. Accent for what is tapped or chosen, ink/muted for every word,
     status and figure, --danger only for "look at this" (a day waiting, ไม่อนุมัติ). */
  --accent:#2FA39A; --accent-ink:#08201E;
  --danger:#F08C8C;
  --hi:rgba(255,255,255,.055); --lo:rgba(0,0,0,.55);
  --raise:6px 6px 14px var(--lo), -4px -4px 12px var(--hi);
  --raise-sm:3px 3px 8px var(--lo), -2px -2px 6px var(--hi);
  --sink:inset 4px 4px 10px var(--lo), inset -3px -3px 8px var(--hi);
  --sink-sh:var(--sink);
  --btn-h:56px; --btn-r:12px; --card-r:16px; --gap:12px; --pad:16px;
  --head-h:64px; --tabs-h:48px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
/* A1.1 R-A8: no zoom in the LINE webview (owner, 19 Oct); both scrolls stay. */
html, body{touch-action:pan-x pan-y}
body{font-family:'IBM Plex Sans Thai',-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding-bottom:40px;min-height:100vh}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
/* below 16px iOS zooms the page on focus */
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{min-height:100vh}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.demo{background:var(--panel);color:var(--ink-2);font-size:12px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.demo b{margin-right:4px}
.demo button{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer}
.demo button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* header + tabs */
header{background:var(--bg);color:var(--ink);padding:0 16px;height:var(--head-h);display:flex;align-items:center;position:sticky;top:0;z-index:6;box-shadow:0 6px 14px var(--lo)}
header .headRow{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
header h1{font-weight:800;font-size:1.2rem;margin:0;white-space:nowrap}
header h1 small{font-size:11px;font-weight:600;opacity:.6;margin-left:6px}
header .who{font-size:12px;color:var(--ink-2);margin-top:3px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header #avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
header .initial{width:42px;height:42px;border-radius:50%;background:var(--panel);box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0}
header .back{width:44px;height:44px;border:none;border-radius:var(--btn-r);background:var(--card);box-shadow:var(--raise-sm);color:var(--ink);font-size:20px;flex-shrink:0;cursor:pointer}
.tabs{display:flex;height:var(--tabs-h);position:sticky;top:var(--head-h);background:var(--bg);z-index:5;box-shadow:0 1px 0 var(--line)}
.tabs button{flex:1;border:none;background:none;padding:12px 6px;font-size:15px;font-weight:600;color:var(--ink-2);font-family:inherit;white-space:nowrap;cursor:pointer}
.tabs button.active{color:var(--accent);border-bottom:3px solid var(--accent);font-weight:700}
.tabs .tabPlus{flex:0 0 auto;min-width:48px;color:var(--accent);font-size:22px;font-weight:700;padding:0 12px}
/* list */
#list{padding:12px;max-width:520px;margin:0 auto}
.empty{text-align:center;padding:60px 20px;color:var(--ink-2);line-height:1.7}
.shopChipRow{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shopChipRow::-webkit-scrollbar{display:none}
.shopChip{flex:0 0 auto;border:none;box-shadow:var(--raise-sm);background:var(--card);color:var(--ink-2);font-family:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;white-space:nowrap;min-height:44px;cursor:pointer}
.shopChip.active{background:var(--card);color:var(--accent);font-weight:800;box-shadow:var(--sink), 0 0 0 2px rgba(47,163,154,.55)}
.groupHead{font-size:14px;font-weight:700;color:var(--ink-2);margin:18px 4px 8px;display:flex;justify-content:space-between;gap:10px}
.groupHead b{color:var(--ink);white-space:nowrap}
.card{background:var(--card);border-radius:var(--card-r);padding:var(--pad);margin-bottom:16px;box-shadow:var(--raise);position:relative}
.card.pending{border-left:3px solid var(--ink-2)}
.card .tap{display:block;width:100%;text-align:left;background:none;border:none;padding:0;color:inherit;font-family:inherit;cursor:pointer}
.card .id{font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.card .title{font-size:17px;font-weight:700;margin-top:2px;line-height:1.45;overflow-wrap:anywhere}
.card .sub{font-size:14px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.card .items{font-size:15px;font-weight:500;color:var(--ink-3);margin-top:10px;line-height:1.55}
.items .it{display:flex;justify-content:space-between;gap:12px}
.items .it b{white-space:nowrap}
.items .it .unknown{color:var(--ink-2);font-weight:600;white-space:nowrap}
.items .it.struck span:first-child,.items .it.struck b{text-decoration:line-through;color:var(--ink-2)}
.items .from{font-size:13px;color:var(--ink-2);margin:-2px 0 4px;overflow-wrap:anywhere}
.items .why{font-size:13px;color:var(--danger);margin:-2px 0 4px}
.clock{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:10px 12px;border-radius:10px;margin:-4px -4px 12px;line-height:1.4;box-shadow:var(--sink)}
.clock.normal{color:var(--ink-2)}
.clock.late{color:var(--danger)}
.promise{margin-top:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.promise.late{color:var(--danger)}
.actionBtn{margin-top:16px;width:100%;min-height:var(--btn-h);border:none;border-radius:var(--btn-r);font-weight:700;font-size:17px;font-family:inherit;background:var(--accent);color:var(--accent-ink);box-shadow:var(--raise-sm);cursor:pointer}
.actionBtn:active{box-shadow:var(--sink)}
.actionBtn.busy{background:var(--panel);color:var(--ink);box-shadow:var(--sink)}
.actionBtn[disabled]:not(.busy){background:var(--line);color:var(--ink-2)}
/* ⋯ has its own row: Order's absolute corner sits on the action button's corner when nothing follows it */
.moreRow{display:flex;justify-content:flex-end;margin:6px -6px -8px 0}
.moreBtn{width:44px;height:36px;border:none;background:none;color:var(--ink-2);font-size:20px;letter-spacing:2px;cursor:pointer}
.moreMenu{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;display:none}
.moreMenu.open{display:block}
.moreMenu .mid{font-size:12px;color:var(--ink-2);padding:2px 4px 6px}
.moreMenu button{display:block;width:100%;text-align:left;padding:12px 4px;border:none;background:none;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer}
.lnk{color:var(--accent);text-decoration:none;font-weight:600}
/* forms */
.miniform{margin-top:12px}
.miniform label{display:block;font-size:15px;color:var(--ink-2);font-weight:600;margin-top:12px}
.miniform input,.miniform select,.miniform textarea{width:100%;min-height:44px;padding:8px 10px;margin-top:4px;border:none;border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);box-shadow:var(--sink);font-family:inherit}
.miniform textarea{min-height:96px;resize:vertical;line-height:1.5}
.miniform input:focus,.miniform select:focus,.miniform textarea:focus{outline:none;box-shadow:var(--sink), 0 0 0 2px rgba(47,163,154,.6)}
.miniform .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:15px;font-weight:600;margin-top:8px;line-height:1.5}
.bad{box-shadow:var(--sink), 0 0 0 2px rgba(240,140,140,.7)!important}
.fsec{margin-top:18px}
.fsec h2{font-size:16px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.fsec h2 small{font-size:12px;color:var(--ink-2);font-weight:600}
.pickRow{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.fitem{padding:12px 0 14px;border-bottom:1px solid var(--line)}
.fitem:last-of-type{border-bottom:none}
.fitem .top{display:flex;gap:8px;align-items:flex-end}
.fitem .top input{flex:1}
.fitem .del{width:44px;height:44px;border:none;border-radius:10px;background:var(--card);box-shadow:var(--raise-sm);color:var(--ink-2);cursor:pointer;flex-shrink:0}
.stepper{display:flex;align-items:center;gap:8px;margin-top:4px}
.stepper button{width:44px;height:44px;border:none;border-radius:10px;background:var(--card);box-shadow:var(--raise-sm);color:var(--accent);font-size:22px;font-weight:700;cursor:pointer;flex-shrink:0}
.stepper input{width:64px;text-align:center;margin-top:0}
.eq{font-size:15px;font-weight:700;color:var(--ink);margin-top:6px;text-align:right}
.eq.unknown{color:var(--ink-2);font-weight:600}
.same{border:none;background:none;color:var(--accent);font-size:14px;font-weight:700;padding:8px 0;min-height:44px;cursor:pointer}
.addBtn{display:block;width:100%;min-height:52px;margin-top:10px;border:1px dashed var(--line);background:var(--card);color:var(--accent);border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;box-shadow:var(--sink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.photoPick{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;margin-top:10px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-2);font-size:15px;cursor:pointer}
.sumBar{position:sticky;bottom:0;background:var(--bg);box-shadow:0 -6px 14px var(--lo);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:6}
.sumBar .sumRow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--ink-2)}
.sumBar .sumRow b{font-size:22px;color:var(--ink);font-weight:800}
.sumBar .note{font-size:12px;color:var(--ink-2);min-height:16px}
.sumBar .actionBtn{margin-top:8px}
/* detail */
.dl{padding:12px;max-width:520px;margin:0 auto}
.lines .ln{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lines .ln:last-child{border-bottom:none}
.lines .ln input{width:24px;height:24px;margin:0;accent-color:var(--accent)}
.lines .ln label{font-size:15px;min-height:44px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow-wrap:anywhere}
.lines .ln small{font-size:12px;color:var(--ink-2)}
.lines .ln.off label{color:var(--ink-2);text-decoration:line-through}
.lines .amt{font-weight:700;white-space:nowrap}
.lines .amt.unknown{color:var(--ink-2);font-weight:600;font-size:13px}
.hint{font-size:13px;color:var(--ink-2);margin-top:8px}
.twoBtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twoBtn .actionBtn,.twoBtn .sheetBtn{margin-top:12px}
.progress{margin-top:14px}
.progress .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .fill{height:100%;background:var(--accent);border-radius:3px}
.progress .label{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--ink-2);gap:4px;text-align:center}
.progress .label b{color:var(--ink);font-weight:700}
.sec{font-size:12px;color:var(--ink-2);font-weight:700;margin:2px 0 8px}
.tl .ev{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding:6px 0}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:7px}
.tl .tt{font-size:15px;font-weight:700}
.tl .sm{font-size:13px;color:var(--ink-2);line-height:1.5;overflow-wrap:anywhere}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pics a{display:block;width:96px;height:96px;border-radius:10px;overflow:hidden;box-shadow:var(--sink)}
.pics img{width:100%;height:100%;object-fit:cover}
/* by shop */
.month{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.month b{font-size:16px}
.month button{width:44px;height:44px;border:none;border-radius:var(--btn-r);background:var(--card);box-shadow:var(--raise-sm);color:var(--ink);font-size:20px;cursor:pointer}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.statBox{background:var(--bg);border-radius:10px;padding:12px 14px;box-shadow:var(--sink)}
.statBox .k{font-size:12px;color:var(--ink-2);font-weight:600}
.statBox .v{font-size:20px;font-weight:800;margin-top:4px;line-height:1.2}
.shopRow{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;color:inherit;padding:9px 0 7px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.shopRow:last-child{border-bottom:none}
.shopRowTop{display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:baseline}
.shopRowTop b{white-space:nowrap}
.shopRowSub{font-size:12px;color:var(--ink-2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.shopBarTrack{height:6px;border-radius:999px;background:var(--line);margin-top:6px;overflow:hidden}
.shopBarFill{height:100%;border-radius:999px;background:var(--accent)}
/* sheet, toast, notice */
.sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px var(--lo);max-height:90vh;overflow:auto}
.sheetTitle{font-size:18px;font-weight:800}
.sheetHint{font-size:13px;color:var(--ink-2);margin:4px 0 12px;line-height:1.5}
.sheetBtn{display:block;width:100%;min-height:52px;margin-top:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.sheetBtn.cancel{color:var(--ink-2);font-weight:600;border-style:dashed}
.sheetBtn[disabled]{opacity:.5}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#toast{position:fixed;left:16px;right:16px;top:calc(var(--head-h) + var(--tabs-h) + 8px);max-width:488px;margin:0 auto;background:var(--panel);color:var(--ink);border:none;box-shadow:var(--raise);padding:12px 16px;border-radius:10px;font-size:14px;text-align:center;z-index:60;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .2s,transform .2s,visibility .2s}
#toast.show{opacity:1;visibility:visible;transform:translateY(0)}
/* A1.4: an error is red words (like the forms, Q2), no red slab. */
#toast.err{color:var(--danger)}
#lastUpdated{text-align:center;font-size:12px;color:var(--ink-2);padding:10px}
.notice{padding:60px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:520px;margin:0 auto}
.notice h2{margin:0;font-size:18px}
.notice p{margin:0;color:var(--ink-2);line-height:1.7}
.notice .actionBtn{max-width:320px;display:flex;align-items:center;justify-content:center;text-decoration:none}
/* ---- v6 Davis Care (work order #17): zones above the v5 tabs, three colours ---- */
.zones{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--bg);position:sticky;top:var(--head-h);z-index:5;box-shadow:0 1px 0 var(--line);scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zones .zone{flex:0 0 auto;min-height:40px;padding:0 14px;border:none;border-radius:999px;background:var(--card);color:var(--ink-2);font-family:inherit;font-size:15px;font-weight:700;box-shadow:var(--raise-sm);cursor:pointer;white-space:nowrap}
.zones .zone.active{color:var(--accent);box-shadow:var(--sink), 0 0 0 2px rgba(47,163,154,.55)}
.zones .zone b{color:var(--ink);margin-left:2px}
.zones + .tabs{top:calc(var(--head-h) + 56px)}
.late{color:var(--danger)}
.pageTitle{font-size:20px;margin:16px 4px 4px}
.secHead{font-size:14px;font-weight:700;color:var(--ink-2);margin:22px 4px 8px}
.secHead.big{font-size:18px;color:var(--ink)}
.secSub{font-size:13px;color:var(--ink-2);margin:-4px 4px 10px}
.empty.small{padding:14px 4px;text-align:left;font-size:14px}
.hero{padding:18px 4px 8px}
.hero .eyebrow{font-size:12px;color:var(--ink-2);font-weight:600}
.hero .big{font-size:30px;font-weight:800;margin:6px 0 6px;line-height:1.15}
.hero .lede{font-size:14px;color:var(--ink-2);line-height:1.6;margin:0}
.hero .lede b{color:var(--ink)}
.quote{margin:14px 0 0;padding:12px 14px;border-radius:12px;box-shadow:var(--sink);font-size:15px;line-height:1.6;color:var(--ink)}
.quote.late b{color:var(--danger)}
.filterRows{margin:8px 0 4px}
.filterRows .fl{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin:8px 4px 0}
.pendLine{font-size:14px;color:var(--ink-2);margin:12px 4px}
.pendLine b{color:var(--ink)}
.alert{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.alert .sev{font-size:13px;font-weight:700;color:var(--ink-2)}
.alert .sev.late{color:var(--danger)}
.alert p{margin:0;font-size:15px;line-height:1.55;color:var(--ink)}
.statBox .v small{font-size:13px;color:var(--ink-2);font-weight:600}
.statBox .delta{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:6px}
.statBox .delta.late{color:var(--danger)}
.statBox .note{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;align-items:center;gap:8px}
.brow .bl{font-size:10px;color:var(--ink-2);font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.brow .bl small{display:block;font-size:10px;font-weight:500;opacity:.85}
.brow .track{height:8px;border-radius:999px;background:var(--bg);box-shadow:var(--sink);overflow:hidden}
.brow .bar{display:block;height:100%;border-radius:999px;background:var(--accent);min-width:2px}
.brow .bn{font-size:9px;font-weight:700;color:var(--ink);white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:4px}
.col{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.col .cn{font-size:9px;font-weight:700;color:var(--ink)}
.col .cb{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.col .cl{font-size:10px;color:var(--ink-2);white-space:nowrap}
.liveClock{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 4px;padding:10px 8px;border-radius:12px;box-shadow:var(--sink)}
.liveClock .lc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-2);font-weight:600;text-align:center}
.liveClock .lc b{font-size:20px;color:var(--ink);font-weight:800}
.liveClock .lcNow{grid-column:1/-1;text-align:center;font-size:11px;color:var(--ink-2);margin-top:4px}
.mustSee{margin:12px 0;padding:10px 12px;border-radius:12px;box-shadow:var(--raise-sm);background:var(--card);border-left:3px solid var(--danger)}
.mustSee .msHead{font-size:14px;font-weight:800;margin-bottom:4px}
.mustSee .msItem{display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink)}
.rcard .tap{display:flex;gap:12px;align-items:flex-start}
.rcard .thumb,.bill .thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--panel)}
.bill{display:flex;gap:12px;align-items:flex-start}
.bill .thumb.none{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2)}
.rbody{min-width:0;flex:1}
.prob{font-size:15px;color:var(--ink);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .clock{margin:12px 0 0}
.xline{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.xline.late{color:var(--danger)}
.fold{margin-top:6px}
.fold summary{cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.slaRow{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.slaRow:first-child{border-top:none}
.slaRow span{color:var(--ink-2);line-height:1.5}
.timeline{list-style:none;padding:var(--pad);margin:0}
.timeline li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.timeline li:first-child{border-top:none}
.timeline .gap{color:var(--ink-2);font-size:12px}
.photos{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.photos img{width:96px;height:96px;border-radius:10px;object-fit:cover}
.trow{display:block;width:100%;text-align:left;border:none;font-family:inherit;color:inherit;cursor:pointer}
.trow .bars{margin-top:10px}
.tick{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;color:var(--ink)}
.tick input{width:22px;height:22px;accent-color:var(--accent)}
.bill select{margin-top:8px;width:100%;min-height:44px;border:none;border-radius:10px;background:var(--bg);color:var(--ink);box-shadow:var(--sink);font-family:inherit;font-size:16px;padding:0 10px}
.linkBtn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:18px}
/* Work order #18: the lines above the board (install, a new build, the age of the data). Muted, never red. */
.topLine{margin:0;padding:8px 16px;font-size:13px;line-height:1.4;color:var(--ink)}
.topLine.muted{color:var(--ink-2)}
button.topLine{display:block;width:100%;min-height:44px;text-align:left;background:none;border:none;font-family:inherit;cursor:pointer}
.isteps{margin:4px 0 8px;padding-left:22px;font-size:15px;line-height:1.7;color:var(--ink)}
.isteps li{margin:4px 0}
.isteps svg{width:18px;height:18px;vertical-align:-3px;margin:0 2px}
/* #18 F1: the installed app runs under the iPhone status bar (black-translucent):
   the sticky header grows by the top inset, and what sticks under it moves with it. */
@media (display-mode: standalone){
  header{padding-top:env(safe-area-inset-top);height:calc(var(--head-h) + env(safe-area-inset-top))}
  .tabs,.zones{top:calc(var(--head-h) + env(safe-area-inset-top))}
  .notice{padding-top:calc(60px + env(safe-area-inset-top))}
}
/* Last colour word: red beats any rule that colours its children (.slaRow span, .xline, .sub). */
#app .late{color:var(--danger)}
</style>

  function approvedCount(row) {
    var items = row.items || [];

  /** Shares of a whole that add up to 100: floor, then the largest remainders. */
  function shares(parts) {
    var total = parts.reduce(function (a, p) { return a + p.baht; }, 0);

    var rows = parts.filter(function (p) { return p.baht > 0; }).map(function (p) {

  }
  function demoSbStart() {
    var me0 = DEMO.me(), lists = DEMO_SB.lists[0].doc;
    var person = DEMO_SB.people.filter(function (p) { return p.uid === me0.userId; })[0];
    sbUnsubAll();
    S.sbRows = {}; S.serverSkew = DEMO.now() - Date.now();
    S.sbLists = lists; S.sb = true; sbPhase = 'on';
    startWith(sbMe(person, lists, DEMO.now()));
  }
  if (DEMO_MODE) {
    var as = (/[?&]as=(\w+)/.exec(QS) || [])[1];
    S.hint = pwaHint(false);
    var getJson = function (u) { return fetch(u).then(function (r) { return r.json(); }).then(null, function () { return null; }); };
    Promise.all([getJson('demo-bd.json'), getJson('demo-sb.json')]).then(function (j) {
      DEMO_BD = j[0];
      DEMO_SB = j[1] && j[1].tables;
      if (!DEMO_SB) { DEMO = makeDemo(as || 'venue_manager'); boot(); return; }
      var seed = demoSeed(DEMO_SB);
      DEMO = makeDemo(as || 'venue_manager', seed);
      SB = window.SB = makeDemoSb(DEMO_SB, DEMO);
      seed.onWrite = function (fn, p) { SB.touch(fn, p); };
      demoSbStart();
    });
    return;
  }
  // #18 §2.6: the last answer of the person's zone, painted before LINE answers, every role.
  var paint = cachedPaint(store(true), function (me) { return tabsFor(me)[0].key; });
  if (paint) {
    S.me = paint.me; S.zone = paint.zone; S.cachedAt = paint.data ? paint.at : 0;
    if (paint.zone === 'purchase') { S.tab = paint.tab; S.board = paint.data; } else { S.z[paint.zone] = paint.data; S.zui[paint.zone] = JSON.parse(JSON.stringify(paint.ui)); }
    if (S.cachedAt && navigator.onLine === false) S.offline = true;
    render();
  }
  if (!LIFF_ID) {
    S.me = null;
    S.notice = { title: L.boardOff, text: 'ยังไม่ได้ตั้งค่า LIFF ของบอร์ด รอผู้ดูแลระบบเปิดใช้' };
    render();
    return;
  }
  if (SB_ON) sbBoot();   // WO#21: Supabase first; LINE loads beside it, for the actions
  var sdk = document.createElement('script');
  sdk.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  sdk.onload = function () {
    liff.init({ liffId: LIFF_ID }).then(function () {
      S.hint = pwaHint(liff.isInClient());
      if (!liff.isLoggedIn()) {
        // v7.1 (#18 §6): asked to install from a browser: the sheet first, no login (the app logs in once itself).
        if (installBeforeLogin({ hint: S.hint, asked: takeInstallAsk(), loggedIn: false })) { S.isheet = S.hint; S.loginAfterSheet = true; render(); return; }
        liff.login({ redirectUri: pwaRedirectUri(location.href) });
        return;
      }
      forgetOtherPerson();
      try { idToken = liff.getIDToken() || ''; accessToken = liff.getAccessToken() || ''; } catch (e) { /* freshCreds tries again */ }
      // The LINE profile picture, top left like Order's header; the initial stays if LINE says no.
      try { liff.getProfile().then(function (p) { if (p && p.pictureUrl) { S.avatar = p.pictureUrl; if (S.view === 'list' && !S.sheet) render(); } }, function () {}); } catch (e) { /* keep the initial */ }
      authReadyResolve();
      sbLiffReady = true;
      if (sbPhase !== 'trying' && sbPhase !== 'on') boot();   // on Supabase, LINE is for the actions only
    }, function () { S.hint = pwaHint(false); authReadyResolve(); sbLiffReady = true; if (sbPhase !== 'trying' && sbPhase !== 'on') boot(); });
  };
  sdk.onerror = function () {
    if (S.me && S.cachedAt) { S.offline = true; render(); return; }
    S.notice = { title: 'เปิดบอร์ดไม่สำเร็จ', text: 'โหลดไลน์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดใหม่' }; render(); };
  document.head.appendChild(sdk);
})();
